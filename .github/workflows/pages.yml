name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish the site root to the gh-pages branch. Creating a gh-pages
      # branch enables GitHub Pages for a public repo without needing the
      # Pages REST API (which the Actions token cannot call here).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,node_modules'
      - name: Report Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 20
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1); then
            echo "::notice title=Pages::$(echo "$out" | tr -d '\n' | head -c 800)"
          else
            echo "::warning title=Pages status::$(echo "$out" | tr -d '\n' | head -c 800)"
          fi
